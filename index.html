<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (nextFetch) {
                  if (typeof nextFetch === 'function') {
                    currentFetch = nextFetch;
                  }
                },
              });
            }
          }
        } catch (_err) {
          // Ignore descriptor lock errors
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
